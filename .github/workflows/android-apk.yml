name: Android APK

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [android/apk-native-host]
  pull_request:
    branches: [feat/android-native-webui]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-arm64:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Go toolchain
        uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache: true

      - name: Run existing Go PoW tests
        run: go test ./...

      - name: Build original Go PoW as WebAssembly
        run: node scripts/build-android-pow.mjs

      - name: Install Android toolchain
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.3.13750724" "cmake;3.22.1"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.3.13750724" >> "$GITHUB_ENV"

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      # libnode is the expensive, pinned native dependency. Cache the final
      # ARM64 library and its matching headers, not the mutable build tree.
      - name: Cache Node.js Mobile ARM64 runtime
        id: node-mobile-cache
        uses: actions/cache@v4
        with:
          path: |
            android/app/src/main/jniLibs/arm64-v8a/libnode.so
            android/app/src/main/cpp/node/include/node
          key: node-mobile-d4aedf536d035bf4eeab7a7a6e18b73d154d0ea5-ndk27.3.13750724-arm64-v1

      - name: Prepare Node.js Mobile source and build ARM64 libnode
        if: steps.node-mobile-cache.outputs.cache-hit != 'true'
        run: |
          git init "$RUNNER_TEMP/nodejs-mobile"
          cd "$RUNNER_TEMP/nodejs-mobile"
          git remote add origin https://github.com/fogtape/nodejs-mobile.git
          git fetch --depth=1 origin d4aedf536d035bf4eeab7a7a6e18b73d154d0ea5
          git checkout --detach FETCH_HEAD
          ./scripts/prepare.sh
          cd out
          ./tools/android_build.sh "$ANDROID_NDK_HOME" 24 arm64
          mkdir -p "$GITHUB_WORKSPACE/android/app/src/main/jniLibs/arm64-v8a"
          cp out_android/arm64-v8a/libnode.so "$GITHUB_WORKSPACE/android/app/src/main/jniLibs/arm64-v8a/libnode.so"
          mkdir -p "$GITHUB_WORKSPACE/android/app/src/main/cpp/node/include"
          cp -R include/node "$GITHUB_WORKSPACE/android/app/src/main/cpp/node/include/node"

      - name: Verify cached or freshly built Node.js runtime
        run: |
          test -s android/app/src/main/jniLibs/arm64-v8a/libnode.so
          test -f android/app/src/main/cpp/node/include/node/node.h

      - name: Install engine dependencies
        run: PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1 npm ci --omit=dev

      - name: Run Node.js tests including Go/WASM adapter vectors
        run: npm test

      - name: Prepare fuckds engine assets
        run: node scripts/prepare-android-assets.mjs

      - name: Build debug APK
        run: gradle --no-daemon -PappVersionCode=${GITHUB_RUN_NUMBER} :app:assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: fuckds-android-arm64-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
