name: Android adaptation smoke

on:
  push:
    branches: ["feat/android-native-webui"]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  android-webui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: node --check src/server.mjs
      - run: node --check src/admin/api.mjs
      - run: node --check web/app.js
      - run: node --test --test-name-pattern="GET /app serves bundled local mobile UI|管理 API：" test/server.test.mjs

  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - run: go test ./...
